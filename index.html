<style>
:root{--bg:#14161a;--panel:#1d2026;--line:#2c313a;--text:#ebe7dc;--mute:#8d939e;--accent:#ffb020;--ok:#6fcf97;--bad:#ef6b5b}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--text);font:400 16px/1.45 Barlow,system-ui,sans-serif}
body{padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 84px);max-width:720px;margin:auto}
h1,h2,.num{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700}
h1{font-size:1.9rem}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.leds{display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.led{display:flex;align-items:center;gap:6px;font-size:.75rem;color:var(--mute);line-height:1}
.led i{width:9px;height:9px;border-radius:50%;background:var(--mute);flex:none}
.led.ok i{background:var(--ok);box-shadow:0 0 6px var(--ok)}.led.ok{color:var(--text)}
.led.cloud i{background:#4aa3ff;box-shadow:0 0 6px #4aa3ff}.led.cloud{color:var(--text)}
.led.bad i{background:var(--bad);box-shadow:0 0 6px var(--bad)}
.led.wait i{background:#ff8a2b;box-shadow:0 0 6px #ff8a2b}
h2{font-size:1.3rem;margin:18px 0 10px}
body{background:transparent}

#splash{position:fixed;inset:0;z-index:999;background:#14161a;display:flex;align-items:center;justify-content:center;transition:opacity .5s}
#splash img{width:min(62vw,280px);height:auto;animation:pop .8s ease-out}
#splash.out{opacity:0;pointer-events:none}
@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){#splash img{animation:none}}
[hidden]{display:none!important}
.view{display:none}.view.on{display:block}
.grid{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.card.wide{grid-column:1/-1}
.lbl{color:var(--mute);font-size:.85rem}
.num{font-size:2rem;line-height:1.1;color:var(--accent)}
.card.wide .num{font-size:2.6rem}
form{display:grid;gap:12px}
label{display:grid;gap:4px;color:var(--mute);font-size:.85rem}
input,select,textarea,button{font:inherit;color:var(--text);background:#101216;border:1px solid var(--line);border-radius:8px;padding:12px;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible,.nav a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button.primary{background:var(--accent);color:#14161a;font-weight:500;border:0;cursor:pointer;padding:14px}
button.ghost{width:auto;padding:6px 10px;font-size:.8rem;color:var(--mute);cursor:pointer}
.dur{border-left:4px solid var(--accent)}
.dur .big{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.5rem}
.dur ul{list-style:none;padding:0;margin-top:8px;color:var(--mute);font-size:.9rem}
.dur li{padding:4px 0;border-top:1px solid var(--line)}
.now{color:var(--ok);font-size:.9rem;margin-top:4px}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 0;border-bottom:1px solid var(--line)}
.item .cat{font-weight:500}.item .val{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.2rem;text-align:right}
.item small{color:var(--mute)}
.acts{display:flex;gap:6px;justify-content:flex-end;align-items:flex-start}
button.ghost.edit{color:var(--accent);border-color:var(--accent)}
button.sec{background:transparent;color:var(--mute);cursor:pointer}
.tag{display:inline-block;background:#2a2410;color:var(--accent);border-radius:6px;padding:0 7px;font-size:.8rem;margin-left:6px}
.empty{color:var(--mute);padding:20px 0;text-align:center}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#0e1013;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav a{flex:1;text-align:center;padding:14px 4px;color:var(--mute);text-decoration:none;font-size:.9rem}
.nav a.on{color:var(--accent);box-shadow:inset 0 3px var(--accent)}
#msg{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--accent);padding:8px 14px;border-radius:8px;display:none;z-index:9}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}.card.wide{grid-column:auto}.card.wide .num{font-size:2rem}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

        <option>Kit de arrastre</option><option>Guayas</option><option>Gasolina</option><option>Otro</option>
      </select>
    </label>
    <label id="posWrap" hidden>Posición de la llanta
      <select id="pos"><option value="">Selecciona…</option><option>Delantera</option><option>Trasera</option></select>
    </label>
    <label>Marca / detalle<input id="marca" placeholder="Ej: Motul 5100 10W-40"></label>
    <div class="row">
      <label>Valor del repuesto ($)<input type="text" id="valor" class="money" inputmode="numeric" autocomplete="off" placeholder="0" required></label>
      <label>Mano de obra / montaje ($)<input type="text" id="mano" class="money" inputmode="numeric" autocomplete="off" placeholder="0 (opcional)"></label>
    </div>
    <div class="card"><span class="lbl">Total de la intervención</span> <span class="num" id="totalForm">$0</span></div>
    <label>Notas<textarea id="notas" rows="3"></textarea></label>
    <button class="primary" type="submit" id="btnGuardar">Guardar registro</button>
    <button class="sec" type="button" id="btnCancelar" hidden>Cancelar edición</button>
  </form>
</section>

<section id="v-hist" class="view">
  <h2>Histórico</h2>
  <div class="row" style="margin-bottom:10px">
    <label>Categoría<select id="fCat"><option value="">Todas</option></select></label>
    <span></span>
    <label>Desde<input type="date" id="fDesde"></label>
    <label>Hasta<input type="date" id="fHasta"></label>
  </div>
  <div id="list"></div>
</section>

<nav class="nav">
  <a href="#resumen" class="on">Resumen</a><a href="#nuevo">Registrar</a><a href="#hist">Histórico</a>
</nav>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query, orderBy }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* 1) PEGA AQUÍ la configuración de tu app web de Firebase */
const firebaseConfig = {
  apiKey: "AIzaSyB-jDeJ1-s7pGVMv7lsnpVTVPaqRbT2Wzg",
  authDomain: "moto-1d150.firebaseapp.com",
  projectId: "moto-1d150",
  storageBucket: "moto-1d150.firebasestorage.app",
  messagingSenderId: "122350935182",
  appId: "1:122350935182:web:636eab6679bb91e343fddf",
  measurementId: "G-CJHHT4BJCV"
};

const app = initializeApp(firebaseConfig);
const db = initializeFirestore(app, { localCache: persistentLocalCache() }); // funciona sin conexión
const auth = getAuth(app);
const $ = id => document.getElementById(id);
const SIN_DURABILIDAD = ["Gasolina", "Otro"];
let registros = [], col = null;

/* ---------- Utilidades ---------- */
const miles = s => String(s).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
const money = n => "$" + miles(Math.round(n));
const num = s => Number(String(s).replace(/\./g, "")) || 0;
const totalDe = r => (r.valor || 0) + (r.mano || 0);
const nombreCat = r => r.categoria === "Llantas" && r.posicion ? `Llantas · ${r.posicion}` : r.categoria;
const kmFmt = n => miles(Math.round(n)) + " km";
const toUTC = s => { const [y, m, d] = s.split("-").map(Number); return new Date(Date.UTC(y, m - 1, d)); };
const fechaFmt = s => toUTC(s).toLocaleDateString("es-CO", { day: "numeric", month: "short", year: "numeric", timeZone: "UTC" });
const esc = t => String(t ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const plural = (n, s, p) => `${n} ${n === 1 ? s : p}`;

function mesesYDias(a, b) { // a, b: Date UTC, a <= b
  let meses = (b.getUTCFullYear() - a.getUTCFullYear()) * 12 + b.getUTCMonth() - a.getUTCMonth();
  if (b.getUTCDate() < a.getUTCDate()) meses--;
  meses = Math.max(0, meses);
  const ancla = new Date(Date.UTC(a.getUTCFullYear(), a.getUTCMonth() + meses, 1));
  ancla.setUTCDate(Math.min(a.getUTCDate(), new Date(Date.UTC(ancla.getUTCFullYear(), ancla.getUTCMonth() + 1, 0)).getUTCDate()));
  return { meses, dias: Math.round((b - ancla) / 864e5) };
}
const duracionTxt = (km, a, b) => {
  const { meses, dias } = mesesYDias(a, b);
  return `Duración: ${kmFmt(km)} / ${plural(meses, "mes", "meses")} y ${plural(dias, "día", "días")}`;
};
const toast = t => { const m = $("msg"); m.textContent = t; m.style.display = "block"; setTimeout(() => m.style.display = "none", 2200); };

/* ---------- Navegación ---------- */
const TABS = ["resumen", "nuevo", "hist"];
const tabGuardada = () => { try { return localStorage.getItem("tab"); } catch (e) { return null; } };
if (!TABS.includes(location.hash.slice(1)) && TABS.includes(tabGuardada())) location.hash = "#" + tabGuardada();
function nav() {
  let v = location.hash.slice(1);
  if (!TABS.includes(v)) v = "resumen";
  try { localStorage.setItem("tab", v); } catch (e) {}
  document.querySelectorAll(".view").forEach(s => s.classList.toggle("on", s.id === "v-" + v));
  document.querySelectorAll(".nav a").forEach(a => a.classList.toggle("on", a.hash === "#" + v));
  scrollTo(0, 0);
}
addEventListener("hashchange", nav); nav();

/* ---------- Firebase ---------- */
/* ---------- Testigos de estado ---------- */
let autenticado = false, servidorOK = false;
function leds() {
  const online = navigator.onLine;
  $("ledNet").className = "led " + (online ? "ok" : "bad");
  $("ledNet").lastChild.textContent = online ? "En línea" : "Sin red";
  const nube = online && autenticado && servidorOK;
  $("ledCloud").className = "led " + (nube ? "cloud" : "wait");
  $("ledCloud").lastChild.textContent = nube ? "Nube OK" : "Conectando...";
}
addEventListener("online", leds); addEventListener("offline", () => { servidorOK = false; leds(); });
leds();

/* ---------- Ruta segura por usuario: users/{uid}/registros ---------- */
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
let unsub = null, rutaUid = null;

function escucharRegistros(uid) {
  if (unsub) unsub();
  rutaUid = uid;
  col = collection(db, "users", uid, "registros");
  unsub = onSnapshot(query(col, orderBy("fecha", "desc")), { includeMetadataChanges: true }, snap => {
    servidorOK = !snap.metadata.fromCache; leds();
    registros = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  }, e => { servidorOK = false; leds(); toast("Error al leer datos: " + e.code); });
}

onAuthStateChanged(auth, user => {
  autenticado = !!user; if (!user) servidorOK = false; leds();
  // Firebase restaura la sesión anónima guardada; si no hay, crea una nueva y guardamos su uid
  if (!user) return signInAnonymously(auth).catch(e => toast("Error de autenticación: " + e.code));
  const guardado = lsGet("moto_user_id");
  if (guardado !== user.uid) {
    // Las reglas solo permiten leer la ruta del uid con sesión activa: un ID distinto daría permission-denied
    if (guardado) toast("Sesión nueva: los registros anteriores no son accesibles desde aquí");
    lsSet("moto_user_id", user.uid);
  }
  if (rutaUid !== user.uid) escucharRegistros(user.uid);
});

$("fecha").valueAsDate = new Date();

function togglePos() {
  const on = $("cat").value === "Llantas";
  $("posWrap").hidden = !on; $("pos").required = on;
  if (!on) $("pos").value = "";
}
$("cat").addEventListener("change", togglePos);

function formatearMoneda(el) { // puntos de mil mientras se escribe, conservando el cursor
  const antes = el.value.slice(0, el.selectionStart).replace(/\D/g, "").length;
  el.value = miles(el.value.replace(/\D/g, "").replace(/^0+(?=\d)/, ""));
  let n = 0, i = 0;
  for (; i < el.value.length && n < antes; i++) if (/\d/.test(el.value[i])) n++;
  el.setSelectionRange(i, i);
}
const totalForm = () => $("totalForm").textContent = money(num($("valor").value) + num($("mano").value));
document.querySelectorAll(".money").forEach(el => el.addEventListener("input", () => { formatearMoneda(el); totalForm(); }));

$("f").addEventListener("submit", async e => {
  e.preventDefault();
  if (!col) return toast("Conectando… intenta de nuevo");
  const r = {
    fecha: $("fecha").value, km: num($("kmIn").value), categoria: $("cat").value,
    posicion: $("cat").value === "Llantas" ? $("pos").value : "",
    marca: $("marca").value.trim(), valor: num($("valor").value), mano: num($("mano").value),
    notas: $("notas").value.trim()
  };
  r.total = r.valor + r.mano;
  if (editId) { // actualiza el mismo documento, sin duplicarlo
    updateDoc(doc(col, editId), r).catch(err => toast("No se pudo actualizar: " + err.code));
    salirEdicion(); toast("Registro actualizado"); location.hash = "#hist";
  } else {
    addDoc(col, r).catch(err => toast("No se pudo guardar: " + err.code)); // en offline se sincroniza luego
    salirEdicion(); toast("Registro guardado"); location.hash = "#resumen";
  }
});

/* ---------- Modo edición ---------- */
let editId = null;
function salirEdicion() {
  editId = null;
  $("f").reset(); $("fecha").valueAsDate = new Date(); togglePos(); totalForm();
  $("formTitle").textContent = "Nuevo registro";
  $("btnGuardar").textContent = "Guardar registro";
  $("btnCancelar").hidden = true;
}
function editar(id) {
  const r = registros.find(x => x.id === id);
  if (!r) return;
  editId = id;
  $("fecha").value = r.fecha; $("kmIn").value = miles(r.km || 0); $("cat").value = r.categoria;
  togglePos(); $("pos").value = r.posicion || "";
  $("marca").value = r.marca || "";
  $("valor").value = miles(r.valor || 0); $("mano").value = r.mano ? miles(r.mano) : "";
  $("notas").value = r.notas || ""; totalForm();
  $("formTitle").textContent = "Editar registro";
  $("btnGuardar").textContent = "Actualizar registro";
  $("btnCancelar").hidden = false;
  location.hash = "#nuevo";
}
$("btnCancelar").addEventListener("click", () => { salirEdicion(); location.hash = "#hist"; });

/* ---------- Cálculos ---------- */
const ordenar = (a, b) => a.fecha.localeCompare(b.fecha) || a.km - b.km;

function intervalos() { // por categoría (llantas: delantera/trasera por separado)
  const out = {};
  const claves = [...new Set(registros.filter(r => !SIN_DURABILIDAD.includes(r.categoria)).map(nombreCat))].sort();
  for (const c of claves) {
    const lista = registros.filter(r => nombreCat(r) === c).sort(ordenar);
    out[c] = { lista, pares: lista.slice(1).map((r, i) => ({ prev: lista[i], cur: r, km: r.km - lista[i].km })) };
  }
  return out;
}

/* ---------- Render ---------- */
function render() {
  const total = registros.reduce((s, r) => s + totalDe(r), 0);
  const ultimoKm = registros.reduce((m, r) => Math.max(m, r.km), 0);
  let prom = 0;
  if (registros.length) {
    const primera = toUTC([...registros].sort(ordenar)[0].fecha), hoy = new Date();
    const dias = (Date.UTC(hoy.getFullYear(), hoy.getMonth(), hoy.getDate()) - primera) / 864e5;
    prom = total / Math.max(1, dias / 30.4375);
  }
  $("tot").textContent = money(total);
  $("avg").textContent = money(prom);
  $("km").textContent = kmFmt(ultimoKm);

  const I = intervalos(), box = $("durs");
  box.innerHTML = Object.keys(I).length ? "" : `<p class="empty">Registra al menos dos cambios de la misma categoría para ver cuánto duran.</p>`;
  for (const [cat, { lista, pares }] of Object.entries(I)) {
    const ult = lista[lista.length - 1];
    const desde = ultimoKm - ult.km;
    const cabeza = pares.length
      ? `<div class="big">${duracionTxt(pares.at(-1).km, toUTC(pares.at(-1).prev.fecha), toUTC(pares.at(-1).cur.fecha))}</div>`
      : `<div class="lbl">Aún sin un cambio anterior para comparar</div>`;
    const hist = pares.slice(0, -1).reverse().map(p =>
      `<li>${fechaFmt(p.cur.fecha)} · ${duracionTxt(p.km, toUTC(p.prev.fecha), toUTC(p.cur.fecha))}</li>`).join("");
    box.insertAdjacentHTML("beforeend", `<div class="card dur" style="margin-bottom:10px">
      <div class="lbl">${esc(cat)} · último cambio ${fechaFmt(ult.fecha)} a ${kmFmt(ult.km)}</div>
      ${cabeza}
      <div class="now">Llevas ${kmFmt(desde)} con el actual</div>
      ${hist ? `<ul>${hist}</ul>` : ""}</div>`);
  }
  renderLista();
}

function tituloRegistro(r) { // "Otro" muestra solo el detalle; el resto, "Categoría · Detalle"
  if (r.categoria === "Otro" && r.marca) return esc(r.marca);
  const pos = r.posicion ? `<span class="tag">${esc(r.posicion)}</span>` : "";
  return esc(r.categoria) + pos + (r.marca ? " · " + esc(r.marca) : "");
}

function renderLista() {
  const sel = $("fCat"), actual = sel.value;
  const cats = [...new Set(registros.map(r => r.categoria))].sort();
  sel.innerHTML = `<option value="">Todas</option>` + cats.map(c => `<option${c === actual ? " selected" : ""}>${esc(c)}</option>`).join("");
  const c = sel.value, d = $("fDesde").value, h = $("fHasta").value;
  const lista = registros.filter(r => (!c || r.categoria === c) && (!d || r.fecha >= d) && (!h || r.fecha <= h))
    .sort((a, b) => ordenar(b, a));
  $("list").innerHTML = lista.length ? lista.map(r => `<div class="item">
      <span class="cat">${tituloRegistro(r)}</span><span class="val">${money(totalDe(r))}</span>
      <small>${fechaFmt(r.fecha)} · ${kmFmt(r.km)}${r.mano ? `<br>Repuesto ${money(r.valor)} + Mano de obra ${money(r.mano)}` : ""}${r.notas ? "<br>" + esc(r.notas) : ""}</small>
      <div class="acts"><button class="ghost edit" data-edit="${r.id}" aria-label="Editar registro">Editar</button><button class="ghost" data-del="${r.id}" aria-label="Eliminar registro">Eliminar</button></div></div>`).join("")
    : `<p class="empty">No hay registros con estos filtros.</p>`;
}
["fCat", "fDesde", "fHasta"].forEach(id => $(id).addEventListener("change", renderLista));
$("list").addEventListener("click", e => {
  if (e.target.dataset.edit) return editar(e.target.dataset.edit);
  const id = e.target.dataset.del;
  if (id && confirm("¿Eliminar este registro?")) {
    if (id === editId) salirEdicion();
    deleteDoc(doc(col, id)).catch(err => toast("No se pudo eliminar: " + err.code));
  }
});


/* Manifest embebido (permite "Añadir a pantalla de inicio" con un solo archivo) */
try {
  const icono = "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" fill="#14161a"/><circle cx="256" cy="256" r="150" fill="none" stroke="#ffb020" stroke-width="28"/><path d="M256 256L340 190" stroke="#ebe7dc" stroke-width="22" stroke-linecap="round"/><circle cx="256" cy="256" r="20" fill="#ffb020"/></svg>');
  const man = { name: "Bitácora Moto", short_name: "Moto", start_url: location.origin + location.pathname, display: "standalone",
    background_color: "#14161a", theme_color: "#14161a", icons: [{ src: icono, sizes: "512x512", type: "image/svg+xml" }] };
  const l = document.createElement("link"); l.rel = "manifest";
  l.href = URL.createObjectURL(new Blob([JSON.stringify(man)], { type: "application/manifest+json" }));
  document.head.appendChild(l);
} catch (e) {}
</script>
</body>
